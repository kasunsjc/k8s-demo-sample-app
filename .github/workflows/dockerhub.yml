name: Docker Hub

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dockerhub-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${HEAD_REF#*/}"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a SemVer version in x.y.z form, got: $version" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Release tag v$version already exists" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.target_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/inspector-api/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: inspector-api
        working-directory: services/inspector-api
        run: go vet ./... && go test ./...
      - name: notes-api
        working-directory: services/notes-api
        run: pip install -r requirements-dev.txt && python -m pytest -q
      - name: worker
        working-directory: services/worker
        run: pip install -r requirements-dev.txt && python -m pytest -q
      - name: ui-gateway
        working-directory: services/ui-gateway
        run: node --test

  push:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inspector-api, notes-api, worker, ui-gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.target_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kubeplay-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          # amd64 for cloud clusters, arm64 for kind on Apple Silicon.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  release:
    needs: [version, push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.target_sha }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.version.outputs.target_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$TARGET_SHA" --generate-notes --title "v$VERSION"
