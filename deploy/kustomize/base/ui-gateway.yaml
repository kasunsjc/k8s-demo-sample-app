apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-gateway
  labels:
    app.kubernetes.io/name: ui-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui-gateway
          image: kubeplay/ui-gateway:0.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: v1
            - name: UI_TITLE
              value: KubePlay
            # Plain Service DNS names — resolved by CoreDNS within the namespace.
            - name: INSPECTOR_URL
              value: http://inspector-api
            - name: NOTES_URL
              value: http://notes-api
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ui-gateway
  labels:
    app.kubernetes.io/name: ui-gateway
spec:
  selector:
    app.kubernetes.io/name: ui-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
