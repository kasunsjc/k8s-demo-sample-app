apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeplay
labels:
  - pairs:
      app.kubernetes.io/part-of: kubeplay
    includeSelectors: false
resources:
  - namespace.yaml
  - redis.yaml
  - inspector-api.yaml
  - notes-api.yaml
  - worker.yaml
  - ui-gateway.yaml
  - ingress.yaml
  - networkpolicy.yaml
