# Any remote cluster: images from a container registry you choose, cluster-default storage class and ingress class.
# `make deploy-remote-kustomize REGISTRY=<registry>` replaces REGISTRY_HOST at apply time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: kubeplay/inspector-api
    newName: REGISTRY_HOST/kubeplay/inspector-api
    newTag: 0.1.1
  - name: kubeplay/notes-api
    newName: REGISTRY_HOST/kubeplay/notes-api
    newTag: 0.1.1
  - name: kubeplay/worker
    newName: REGISTRY_HOST/kubeplay/worker
    newTag: 0.1.1
  - name: kubeplay/ui-gateway
    newName: REGISTRY_HOST/kubeplay/ui-gateway
    newTag: 0.1.1
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name in (inspector-api,notes-api,worker,ui-gateway)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: CronJob
      name: worker-report
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Always
