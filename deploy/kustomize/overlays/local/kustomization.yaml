# Local clusters (kind / minikube / Docker Desktop): locally built :dev images, UI on NodePort 30080.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: kubeplay/inspector-api
    newTag: dev
  - name: kubeplay/notes-api
    newTag: dev
  - name: kubeplay/worker
    newTag: dev
  - name: kubeplay/ui-gateway
    newTag: dev
patches:
  - target:
      kind: Service
      name: ui-gateway
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Ingress
      name: kubeplay
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: kubeplay
