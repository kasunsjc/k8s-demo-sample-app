# Local clusters (kind / minikube / Docker Desktop): images from Docker Hub (make dockerhub-push), UI on NodePort 30080.
# On Apple Silicon kind the images must include linux/arm64 (push with PLATFORMS=linux/amd64,linux/arm64).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: kubeplay/inspector-api
    newName: kasunsjc/kubeplay-inspector-api
    newTag: 0.1.0
  - name: kubeplay/notes-api
    newName: kasunsjc/kubeplay-notes-api
    newTag: 0.1.0
  - name: kubeplay/worker
    newName: kasunsjc/kubeplay-worker
    newTag: 0.1.0
  - name: kubeplay/ui-gateway
    newName: kasunsjc/kubeplay-ui-gateway
    newTag: 0.1.0
patches:
  - target:
      kind: Service
      name: ui-gateway
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Ingress
      name: kubeplay
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: kubeplay
