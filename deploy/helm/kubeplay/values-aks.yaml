# helm upgrade --install kubeplay deploy/helm/kubeplay -n kubeplay --create-namespace \
#   -f deploy/helm/kubeplay/values-aks.yaml --set global.imageRegistry=<acr>.azurecr.io
global:
  imageRegistry: ACR_NAME.azurecr.io
  imageTag: "0.1.1"
  imagePullPolicy: Always
ui:
  title: KubePlay on AKS
redis:
  storage:
    storageClass: managed-csi
ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
# Distributed tracing to Application Insights. `make aks-deploy-helm ACR=<acr> APPINSIGHTS_CONNECTION_STRING='...'`
# creates the appinsights Secret and sets tracing.enabled=true.
tracing:
  enabled: false
