{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-clients
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["notes-api", "worker", "worker-report", "seed-notes"]
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-api-allow-gateway
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "notes-api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notes-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ui-gateway
      ports:
        - port: 8000
{{- end }}
