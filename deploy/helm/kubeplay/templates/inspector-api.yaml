{{- if .Values.inspector.enabled }}
{{- $v := .Values.inspector }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inspector-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inspector-config
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
data:
  app-message: {{ $v.message | quote }}
  feature-flags.json: {{ $v.featureFlags | toJson | quote }}
  welcome.txt: |
    Edit me with `kubectl edit cm inspector-config -n {{ .Release.Namespace }}` and call /config again.
---
apiVersion: v1
kind: Secret
metadata:
  name: inspector-secret
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $v.secret.apiKey | quote }}
  db-password: {{ $v.secret.dbPassword | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inspector-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
spec:
  {{- if not $v.hpa.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inspector-api
  template:
    metadata:
      labels:
        {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: inspector-api
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "kubeplay.podSecurityContext" 65532 | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inspector-api
      containers:
        - name: inspector-api
          image: {{ include "kubeplay.image" (dict "root" . "image" $v.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ $v.version | quote }}
            - name: APP_COLOR
              value: {{ $v.color | quote }}
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: inspector-config
                  key: app-message
            - name: STARTUP_DELAY_SECONDS
              value: {{ $v.startupDelaySeconds | quote }}
            - name: SHUTDOWN_DELAY_SECONDS
              value: {{ $v.shutdownDelaySeconds | quote }}
            {{- include "kubeplay.downwardEnv" . | nindent 12 }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: CPU_LIMIT_MILLICORES
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: 1m
            - name: MEMORY_LIMIT_MIB
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: 1Mi
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- include "kubeplay.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kubeplay/config
              readOnly: true
            - name: secrets
              mountPath: /etc/kubeplay/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: inspector-config
        - name: secrets
          secret:
            secretName: inspector-secret
---
apiVersion: v1
kind: Service
metadata:
  name: inspector-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: inspector-api
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $v.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inspector-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inspector-api
  minReplicas: {{ $v.hpa.minReplicas }}
  maxReplicas: {{ $v.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.hpa.cpuUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
{{- end }}
{{- if $v.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inspector-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "inspector-api") | nindent 4 }}
spec:
  minAvailable: {{ $v.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inspector-api
{{- end }}
{{- end }}
