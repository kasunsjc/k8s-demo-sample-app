{{- if .Values.notes.enabled }}
{{- $v := .Values.notes }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "notes-api") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "notes-api") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-api
  template:
    metadata:
      labels:
        {{- include "kubeplay.labels" (dict "root" . "name" "notes-api") | nindent 8 }}
    spec:
      serviceAccountName: notes-api
      securityContext:
        {{- include "kubeplay.podSecurityContext" 10001 | nindent 8 }}
      initContainers:
        - name: wait-for-redis
          image: {{ .Values.redis.image }}
          command:
            - sh
            - -c
            - until redis-cli --no-auth-warning -h "$REDIS_HOST" -a "$REDIS_PASSWORD" ping | grep -q PONG; do echo waiting for redis; sleep 2; done
          env:
            {{- include "kubeplay.redisEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: notes-api
          image: {{ include "kubeplay.image" (dict "root" . "image" $v.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: {{ $v.version | quote }}
            - name: ROOT_PATH
              value: /api/notes
            {{- include "kubeplay.redisEnv" . | nindent 12 }}
            {{- include "kubeplay.downwardEnv" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            {{- include "kubeplay.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  labels:
    {{- include "kubeplay.labels" (dict "root" . "name" "notes-api") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: notes-api
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
