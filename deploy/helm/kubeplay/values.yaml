global:
  # e.g. myacr.azurecr.io — prefixed to every kubeplay image.
  imageRegistry: ""
  imageTag: "0.1.1"
  imagePullPolicy: IfNotPresent

inspector:
  enabled: true
  image: kubeplay/inspector-api
  replicas: 3
  version: v1
  color: "#3b82f6"
  message: "Hello from KubePlay!"
  startupDelaySeconds: 3
  shutdownDelaySeconds: 5
  featureFlags:
    newDashboard: false
    maxItems: 10
  # Demo values only.
  secret:
    apiKey: demo-api-key-1234567890
    dbPassword: not-a-real-password
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 50
  pdb:
    enabled: true
    minAvailable: 2

notes:
  enabled: true
  image: kubeplay/notes-api
  replicas: 2
  version: v1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

worker:
  enabled: true
  image: kubeplay/worker
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 250m, memory: 128Mi}
  cronjob:
    enabled: true
    schedule: "*/5 * * * *"
  seedJob:
    enabled: true
    count: 5

redis:
  enabled: true
  image: redis:7.4-alpine
  # Demo credential only — use an external secret store for real workloads.
  password: kubeplay-demo-password
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

ui:
  enabled: true
  image: kubeplay/ui-gateway
  replicas: 2
  version: v1
  title: KubePlay
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 250m, memory: 128Mi}

ingress:
  enabled: false
  className: ""
  host: ""

networkPolicy:
  enabled: true

# Distributed tracing to Azure Monitor Application Insights (Azure Monitor traces / Trace Analytics preview).
# Services send OTLP spans to an OpenTelemetry Collector, which exports them with the azure_monitor exporter.
tracing:
  enabled: false
  # Application Insights connection string. Leave empty to use an existing Secret named `appinsights`
  # with key `connection-string` (make appinsights-secret APPINSIGHTS_CONNECTION_STRING='...').
  connectionString: ""
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
